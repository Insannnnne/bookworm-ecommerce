openapi: 3.0.3
info:
  title: Book Worm E-Bookstore API
  description: >
    OpenAPI specification for the Book Worm e-bookstore platform.
    Covers product/book management, category management, author (brand) management,
    search & filtering, related products, shopping cart, order management,
    payment processing, purchase confirmation, wishlist, and
    order-history-based recommendations.
  version: 1.0.0
  contact:
    name: Book Worm API Support

servers:
  - url: https://api.bookworm.com/v1
    description: Production server

tags:
  - name: Auth
    description: User authentication and profile
  - name: Categories
    description: Book category management
  - name: Authors
    description: Author (brand) management
  - name: Products
    description: Book / product management
  - name: Search
    description: Product search and filtering
  - name: Related Products
    description: Related book recommendations
  - name: Recommendations
    description: Personalised recommendations based on order history
  - name: Wishlist
    description: User wishlist management
  - name: Cart
    description: Shopping cart management
  - name: Orders
    description: Order management
  - name: Payment
    description: Payment processing
  - name: Confirmation
    description: Purchase confirmation

# ---------------------------------------------------------------------------
# PATHS
# ---------------------------------------------------------------------------
paths:

  # ── AUTH ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user and obtain JWT token
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalidate user session
      operationId: logoutUser
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Logged out successfully

  /users/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      tags: [Auth]
      summary: Update current user profile
      operationId: updateCurrentUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/me/addresses:
    get:
      tags: [Auth]
      summary: List saved delivery addresses for current user
      operationId: listAddresses
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
    post:
      tags: [Auth]
      summary: Add a new delivery address
      operationId: addAddress
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'

  /users/me/addresses/{addressId}:
    put:
      tags: [Auth]
      summary: Update a saved address
      operationId: updateAddress
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/addressId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
    delete:
      tags: [Auth]
      summary: Delete a saved address
      operationId: deleteAddress
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/addressId'
      responses:
        '204':
          description: Address deleted

  # ── CATEGORIES ────────────────────────────────────────────────────────────
  /categories:
    get:
      tags: [Categories]
      summary: List all book categories
      operationId: listCategories
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [Categories]
      summary: Create a new category (admin)
      operationId: createCategory
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

  /categories/{categoryId}:
    get:
      tags: [Categories]
      summary: Get a single category
      operationId: getCategory
      parameters:
        - $ref: '#/components/parameters/categoryId'
      responses:
        '200':
          description: Category detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Categories]
      summary: Update a category (admin)
      operationId: updateCategory
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/categoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    delete:
      tags: [Categories]
      summary: Delete a category (admin)
      operationId: deleteCategory
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/categoryId'
      responses:
        '204':
          description: Category deleted

  /categories/{categoryId}/products:
    get:
      tags: [Categories]
      summary: List products in a category
      operationId: listProductsByCategory
      parameters:
        - $ref: '#/components/parameters/categoryId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Paginated list of books in the category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'

  # ── AUTHORS (BRAND) ───────────────────────────────────────────────────────
  /authors:
    get:
      tags: [Authors]
      summary: List all authors
      operationId: listAuthors
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Paginated list of authors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorPage'
    post:
      tags: [Authors]
      summary: Create a new author (admin)
      operationId: createAuthor
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorRequest'
      responses:
        '201':
          description: Author created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'

  /authors/{authorId}:
    get:
      tags: [Authors]
      summary: Get author details
      operationId: getAuthor
      parameters:
        - $ref: '#/components/parameters/authorId'
      responses:
        '200':
          description: Author detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '404':
          description: Author not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Authors]
      summary: Update an author (admin)
      operationId: updateAuthor
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/authorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorRequest'
      responses:
        '200':
          description: Author updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
    delete:
      tags: [Authors]
      summary: Delete an author (admin)
      operationId: deleteAuthor
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/authorId'
      responses:
        '204':
          description: Author deleted

  /authors/{authorId}/products:
    get:
      tags: [Authors]
      summary: List all books by an author
      operationId: listProductsByAuthor
      parameters:
        - $ref: '#/components/parameters/authorId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Paginated list of books by author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'

  # ── PRODUCTS ──────────────────────────────────────────────────────────────
  /products:
    get:
      tags: [Products]
      summary: List all products with optional filters
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, newest, bestseller]
            default: relevance
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
    post:
      tags: [Products]
      summary: Create a new product/book (admin)
      operationId: createProduct
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /products/{productId}:
    get:
      tags: [Products]
      summary: Get product detail
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Products]
      summary: Update a product (admin)
      operationId: updateProduct
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    delete:
      tags: [Products]
      summary: Delete a product (admin)
      operationId: deleteProduct
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '204':
          description: Product deleted

  /products/{productId}/reviews:
    get:
      tags: [Products]
      summary: Get reviews for a product
      operationId: listReviews
      parameters:
        - $ref: '#/components/parameters/productId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Paginated reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
    post:
      tags: [Products]
      summary: Submit a review for a product
      operationId: createReview
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'

  # ── SEARCH ────────────────────────────────────────────────────────────────
  /products/search:
    get:
      tags: [Search]
      summary: Search and filter products
      operationId: searchProducts
      parameters:
        - name: q
          in: query
          description: Full-text search query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: authorId
          in: query
          schema:
            type: integer
        - name: language
          in: query
          schema:
            type: string
            example: English
        - name: format
          in: query
          schema:
            type: string
            enum: [Paperback, Hardcover, eBook, AudioBook]
        - name: minPrice
          in: query
          schema:
            type: number
            format: double
        - name: maxPrice
          in: query
          schema:
            type: number
            format: double
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, newest, bestseller]
            default: relevance
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'

  # ── RELATED PRODUCTS ──────────────────────────────────────────────────────
  /products/{productId}/related:
    get:
      tags: [Related Products]
      summary: Get related books for a product
      operationId: getRelatedProducts
      parameters:
        - $ref: '#/components/parameters/productId'
        - name: limit
          in: query
          schema:
            type: integer
            default: 6
            maximum: 20
      responses:
        '200':
          description: List of related books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductSummary'

  # ── RECOMMENDATIONS ───────────────────────────────────────────────────────
  /users/me/recommendations:
    get:
      tags: [Recommendations]
      summary: Get personalised book recommendations based on order history
      operationId: getRecommendations
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        '200':
          description: Personalised recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductSummary'

  /products/featured:
    get:
      tags: [Recommendations]
      summary: Get featured sections (Recommended for You, Bestsellers, New Launches)
      operationId: getFeaturedProducts
      parameters:
        - name: section
          in: query
          required: true
          schema:
            type: string
            enum: [recommended, bestsellers, new_launches]
        - name: limit
          in: query
          schema:
            type: integer
            default: 6
      responses:
        '200':
          description: Featured product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductSummary'

  # ── WISHLIST ──────────────────────────────────────────────────────────────
  /users/me/wishlist:
    get:
      tags: [Wishlist]
      summary: Get current user's wishlist
      operationId: getWishlist
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Wishlist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WishlistItem'
    post:
      tags: [Wishlist]
      summary: Add a product to wishlist
      operationId: addToWishlist
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishlistRequest'
      responses:
        '201':
          description: Product added to wishlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistItem'

  /users/me/wishlist/{productId}:
    delete:
      tags: [Wishlist]
      summary: Remove a product from wishlist
      operationId: removeFromWishlist
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '204':
          description: Product removed from wishlist

  # ── CART ──────────────────────────────────────────────────────────────────
  /cart:
    get:
      tags: [Cart]
      summary: Get current user's cart
      operationId: getCart
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cart with items and totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
    delete:
      tags: [Cart]
      summary: Clear the cart
      operationId: clearCart
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Cart cleared

  /cart/items:
    post:
      tags: [Cart]
      summary: Add an item to the cart
      operationId: addCartItem
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

  /cart/items/{cartItemId}:
    put:
      tags: [Cart]
      summary: Update cart item quantity
      operationId: updateCartItem
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/cartItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemUpdateRequest'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
    delete:
      tags: [Cart]
      summary: Remove an item from the cart
      operationId: removeCartItem
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/cartItemId'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

  /cart/coupon:
    post:
      tags: [Cart]
      summary: Apply a coupon code to the cart
      operationId: applyCoupon
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponRequest'
      responses:
        '200':
          description: Cart with discount applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Invalid or expired coupon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Cart]
      summary: Remove the applied coupon
      operationId: removeCoupon
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cart with coupon removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

  # ── ORDERS ────────────────────────────────────────────────────────────────
  /orders:
    get:
      tags: [Orders]
      summary: List current user's orders (order history)
      operationId: listOrders
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Paginated order history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
    post:
      tags: [Orders]
      summary: Place a new order (checkout)
      operationId: createOrder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Cart is empty or invalid address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get order details
      operationId: getOrder
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderId}/buy-again:
    post:
      tags: [Orders]
      summary: Add all items from a past order back to the cart
      operationId: buyAgain
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Cart updated with re-ordered items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

  # ── PAYMENT ───────────────────────────────────────────────────────────────
  /payments/initiate:
    post:
      tags: [Payment]
      summary: Initiate payment for an order
      operationId: initiatePayment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInitiateRequest'
      responses:
        '200':
          description: Payment session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSession'
        '400':
          description: Invalid payment method or order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payments/{paymentId}/confirm:
    post:
      tags: [Payment]
      summary: Confirm / complete the payment
      operationId: confirmPayment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/paymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentConfirmRequest'
      responses:
        '200':
          description: Payment result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '402':
          description: Payment failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payments/{paymentId}:
    get:
      tags: [Payment]
      summary: Get payment status
      operationId: getPaymentStatus
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/paymentId'
      responses:
        '200':
          description: Payment status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'

  # ── CONFIRMATION ──────────────────────────────────────────────────────────
  /orders/{orderId}/confirmation:
    get:
      tags: [Confirmation]
      summary: Get purchase confirmation for a completed order
      operationId: getOrderConfirmation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Purchase confirmation with purchased books and delivery details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderConfirmation'
        '404':
          description: Order not found or not yet confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

# ---------------------------------------------------------------------------
# COMPONENTS
# ---------------------------------------------------------------------------
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    productId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    categoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    authorId:
      name: authorId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    orderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    paymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
    cartItemId:
      name: cartItemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    addressId:
      name: addressId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
    size:
      name: size
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

  schemas:

    # ── Auth ────────────────────────────────────────────────────────────────
    UserRegisterRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8

    UserLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT bearer token
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time

    UserUpdateRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string

    # ── Address ─────────────────────────────────────────────────────────────
    AddressRequest:
      type: object
      required: [firstName, lastName, addressLine1, city, pinCode, state, country, phone]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        pinCode:
          type: string
        state:
          type: string
        country:
          type: string
          default: India
        phone:
          type: string

    Address:
      allOf:
        - $ref: '#/components/schemas/AddressRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64

    # ── Category ────────────────────────────────────────────────────────────
    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    Category:
      allOf:
        - $ref: '#/components/schemas/CategoryRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
            productCount:
              type: integer

    # ── Author ──────────────────────────────────────────────────────────────
    AuthorRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        bio:
          type: string
        profileImageUrl:
          type: string
          format: uri

    Author:
      allOf:
        - $ref: '#/components/schemas/AuthorRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64

    AuthorPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Author'
        totalElements:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer

    # ── Product ─────────────────────────────────────────────────────────────
    ProductRequest:
      type: object
      required: [title, authorId, categoryIds, price, format, language]
      properties:
        title:
          type: string
        authorId:
          type: integer
          format: int64
        publisherId:
          type: integer
          format: int64
        categoryIds:
          type: array
          items:
            type: integer
            format: int64
        description:
          type: string
        price:
          type: number
          format: double
        format:
          type: string
          enum: [Paperback, Hardcover, eBook, AudioBook]
        language:
          type: string
        coverImageUrl:
          type: string
          format: uri
        isbn:
          type: string
        publishedDate:
          type: string
          format: date
        stock:
          type: integer

    ProductSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        authorName:
          type: string
        coverImageUrl:
          type: string
          format: uri
        price:
          type: number
          format: double
        format:
          type: string
        categories:
          type: array
          items:
            type: string
        averageRating:
          type: number
          format: double
        deliveryDate:
          type: string
          format: date

    Product:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          properties:
            language:
              type: string
            isbn:
              type: string
            publishedDate:
              type: string
              format: date
            stock:
              type: integer
            soldCount:
              type: integer

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            description:
              type: string
            publisher:
              type: string
            author:
              $ref: '#/components/schemas/Author'
            reviewCount:
              type: integer

    ProductPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        totalElements:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer

    # ── Review ──────────────────────────────────────────────────────────────
    ReviewRequest:
      type: object
      required: [rating, comment]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500

    Review:
      allOf:
        - $ref: '#/components/schemas/ReviewRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
            userId:
              type: integer
              format: int64
            reviewerName:
              type: string
            createdAt:
              type: string
              format: date-time

    ReviewPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        totalElements:
          type: integer
        totalPages:
          type: integer

    # ── Wishlist ────────────────────────────────────────────────────────────
    WishlistRequest:
      type: object
      required: [productId]
      properties:
        productId:
          type: integer
          format: int64

    WishlistItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        product:
          $ref: '#/components/schemas/ProductSummary'
        addedAt:
          type: string
          format: date-time

    # ── Cart ─────────────────────────────────────────────────────────────────
    CartItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1

    CartItemUpdateRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1

    CartItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        product:
          $ref: '#/components/schemas/ProductSummary'
        quantity:
          type: integer
        lineTotal:
          type: number
          format: double

    CouponRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string

    Cart:
      type: object
      properties:
        id:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subTotal:
          type: number
          format: double
        tax:
          type: number
          format: double
        deliveryCharges:
          type: number
          format: double
        couponCode:
          type: string
        discount:
          type: number
          format: double
        totalAmount:
          type: number
          format: double

    # ── Order ────────────────────────────────────────────────────────────────
    OrderRequest:
      type: object
      required: [addressId, paymentMethod]
      properties:
        addressId:
          type: integer
          format: int64
        paymentMethod:
          type: string
          enum: [CREDIT_CARD, DEBIT_CARD, UPI, WALLET]
        couponCode:
          type: string

    OrderItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        product:
          $ref: '#/components/schemas/ProductSummary'
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
        lineTotal:
          type: number
          format: double
        estimatedDeliveryDate:
          type: string
          format: date

    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDING, CONFIRMED, SHIPPED, DELIVERED, CANCELLED]
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        deliveryAddress:
          $ref: '#/components/schemas/Address'
        subTotal:
          type: number
          format: double
        tax:
          type: number
          format: double
        deliveryCharges:
          type: number
          format: double
        discount:
          type: number
          format: double
        totalAmount:
          type: number
          format: double
        paymentMethod:
          type: string
        paymentStatus:
          type: string
          enum: [PENDING, SUCCESS, FAILED]
        placedAt:
          type: string
          format: date-time

    OrderPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        totalElements:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer

    # ── Payment ──────────────────────────────────────────────────────────────
    PaymentInitiateRequest:
      type: object
      required: [orderId, paymentMethod]
      properties:
        orderId:
          type: integer
          format: int64
        paymentMethod:
          type: string
          enum: [CREDIT_CARD, DEBIT_CARD, UPI, WALLET]

    PaymentSession:
      type: object
      properties:
        paymentId:
          type: string
        orderId:
          type: integer
          format: int64
        payableAmount:
          type: number
          format: double
        paymentMethod:
          type: string
        expiresAt:
          type: string
          format: date-time

    PaymentConfirmRequest:
      type: object
      required: [paymentMethod]
      properties:
        paymentMethod:
          type: string
          enum: [CREDIT_CARD, DEBIT_CARD, UPI, WALLET]
        cardNumber:
          type: string
          description: Last 4 digits only — full number never stored
        nameOnCard:
          type: string
        expiryDate:
          type: string
          pattern: '^(0[1-9]|1[0-2])\/\d{2}$'
        cvv:
          type: string
          writeOnly: true
        upiId:
          type: string

    PaymentResult:
      type: object
      properties:
        paymentId:
          type: string
        orderId:
          type: integer
          format: int64
        status:
          type: string
          enum: [SUCCESS, FAILED, PENDING]
        transactionId:
          type: string
        paidAmount:
          type: number
          format: double
        paidAt:
          type: string
          format: date-time

    # ── Order Confirmation ───────────────────────────────────────────────────
    OrderConfirmation:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
        message:
          type: string
          example: Your purchase of the following reads is successful
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        totalAmount:
          type: number
          format: double
        paymentStatus:
          type: string
          enum: [SUCCESS]
        transactionId:
          type: string
        placedAt:
          type: string
          format: date-time

    # ── Generic Error ────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
