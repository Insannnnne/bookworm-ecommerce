# =============================================================================
# Book Worm E-Bookstore — Application Configuration
# =============================================================================
# Sensitive values are read from environment variables.
# Defaults shown below are for local development only.
# Never commit real credentials to version control.
# =============================================================================

# ── Application ───────────────────────────────────────────────────────────────
spring.application.name=bookworm
server.port=${SERVER_PORT:8080}
server.address=127.0.0.1

# ── PostgreSQL DataSource ─────────────────────────────────────────────────────
# Set DB_URL, DB_USERNAME, DB_PASSWORD as environment variables in production.
# Example: jdbc:postgresql://<host>:<port>/<database>
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookworm}
spring.datasource.username=${DB_USERNAME:bookworm}
spring.datasource.password=${DB_PASSWORD:bookworm}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool ──────────────────────────────────────────────────
# Spring Boot auto-selects HikariCP; these values tune it for typical workloads.
spring.datasource.hikari.pool-name=BookwormHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# ddl-auto=update: Hibernate applies incremental schema changes on startup.
# Change to 'validate' in production once the schema is stable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# SpringPhysicalNamingStrategy converts camelCase field names to snake_case
# column names automatically (e.g. firstName -> first_name).
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.properties.hibernate.format_sql=true

# Keep lazy-loaded associations alive inside a request (Open Session in View).
# Disabled to avoid N+1 queries; services must eagerly fetch what they need.
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────────────────────
# Set JWT_SECRET to a random 256-bit (32+ character) string in production.
app.jwt.secret=${JWT_SECRET:bookworm-secret-key-replace-in-prod-min32chars!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── SpringDoc / Swagger UI ────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.bookworm=DEBUG
# Uncomment to log generated SQL in development:
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
