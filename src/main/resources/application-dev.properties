# =============================================================================
# Dev profile — uses H2 in-memory database (no PostgreSQL required)
# Activate with: -Dspring.profiles.active=dev
# =============================================================================
spring.datasource.url=jdbc:h2:mem:bookwormdev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Omit dialect — Hibernate auto-detects H2 (avoids HHH90000025 deprecation warning)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
